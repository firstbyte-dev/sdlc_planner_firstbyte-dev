<script>
/* ================= KONFIGURASI ================= */
const CONFIG = {
  SUPABASE_URL: 'https://vyiyrwzbnvlipwhfdtqz.supabase.co',            // contoh: https://abcd1234.supabase.co
  SUPABASE_ANON_KEY: 'sb_publishable_PkPsagiSqx66vyCqQcVTCA_4_T9UpwX',       // anon public key
  ADMIN_EMAIL: 'admin@sdlc-planner.com', // harus sama dengan email user di Supabase
  USERNAME_LABEL: 'admin',     // username permanen (hanya tampilan)
  HINT: 'Pengingat: isi kisi-kisi password Anda di sini (CONFIG.HINT).',
  DEMO_PASSWORD: 'admin123',   // hanya untuk mode demo lokal
};

/* ================= UTIL ================= */
const $ = (s) => document.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (d) => (d ? new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-');

/* ================= API (Supabase / lokal) ================= */
const SB = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase
  ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const LS = 'sdlc_projects_v5';
const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } };
const lsWrite = (a) => localStorage.setItem(LS, JSON.stringify(a));

const api = SB ? {
  async session() { const { data } = await SB.auth.getSession(); return !!data.session; },
  async login(pw) { const { error } = await SB.auth.signInWithPassword({ email: CONFIG.ADMIN_EMAIL, password: pw }); window._err = error ? error.message : ''; if (error) console.error(error); return !error; },
  async logout() { await SB.auth.signOut(); },
  async list() { const { data, error } = await SB.from('projects').select('id,title,percent,completed_at,updated_at').order('updated_at', { ascending: false }); if (error) throw error; return data; },
  async get(id) { const { data, error } = await SB.from('projects').select('*').eq('id', id).single(); if (error) throw error; return data; },
  async save(id, row) {
    if (id) { const { error } = await SB.from('projects').update(row).eq('id', id); if (error) throw error; return id; }
    const { data, error } = await SB.from('projects').insert(row).select('id').single(); if (error) throw error; return data.id;
  },
  async remove(id) { const { error } = await SB.from('projects').delete().eq('id', id); if (error) throw error; },
} : {
  async session() { return sessionStorage.getItem('sdlc_ok') === '1'; },
  async login(pw) { if (pw === CONFIG.DEMO_PASSWORD) { sessionStorage.setItem('sdlc_ok', '1'); return true; } return false; },
  async logout() { sessionStorage.removeItem('sdlc_ok'); },
  async list() { return lsRead().sort((a, b) => b.updated_at.localeCompare(a.updated_at)).map(({ form, ...r }) => r); },
  async get(id) { return lsRead().find((r) => r.id === id); },
  async save(id, row) {
    const all = lsRead();
    if (id) { const i = all.findIndex((r) => r.id === id); all[i] = { ...all[i], ...row }; lsWrite(all); return id; }
    const nid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    all.push({ id: nid, created_at: new Date().toISOString(), ...row }); lsWrite(all); return nid;
  },
  async remove(id) { lsWrite(lsRead().filter((r) => r.id !== id)); },
};

/* ================= SKEMA HALAMAN ================= */
const T = (k, l, p = '', d = '') => ({ t: 'text', k, l, p, d });

const TYPES = ['Website Portofolio Pribadi', 'Landing Page Perusahaan / B2B', 'Promotional Landing Page', 'Company Profile & Web App', 'Website E-Commerce (Toko Online)', 'Website Berita dan Media Informasi (News & Content Portal)', 'Blog Pribadi / Niche Blog', 'Website Edukasi & E-Learning (LMS)', 'Website Komunitas dan Forum Diskusi', 'Aplikasi Berbasis Web (Web Application / SaaS)'];
const STACKS = ['Next.js (App Router & React)', 'React & TypeScript', 'Vue / Nuxt', 'Tailwind CSS', 'Framer Motion / GSAP', 'HTML5, CSS3 & Vanilla JS', 'Node.js / REST API / Supabase', 'Git, GitHub & Vercel / GitHub Pages', 'Figma (UI/UX & Design System)'];
const METHODS = ['Agile / Iterative Sprint (MVP dulu lalu penyempurnaan)', 'Kanban (To-Do, In Progress, Done)', 'Mobile-First & Component-Driven Design', 'AI-Assisted Vibe Coding + Manual Code Review'];
const SECS = ['Hero Section Utama', 'Profil / Tentang / Pendidikan', 'Layanan / Pengalaman Kerja', 'Keahlian / Portofolio Proyek', 'Kontak & Footer'];

let cur = null;          // {id, form, page, dirty, completed_at}
let sideOpen = window.innerWidth >= 1024;
let timer = null, q = Promise.resolve();

function newForm() {
  const f = { _done: {} };
  PAGES.forEach((p) => p.f.forEach((x) => {
    if (x.t === 'chips') f[x.k] = [...x.d];
    else if (x.t === 'select') f[x.k] = x.o[0];
    else if (x.k) f[x.k] = x.d || '';
  }));
  return f;
}
const pct = (f) => Math.min(100, Math.round((Object.keys(f._done || {}).filter((k) => f._done[k] && +k < PAGES.length).length / PAGES.length) * 100));

/* ================= PROMPT ================= */
function buildPrompt(f) {
  const out = [PROMPT_HEAD];  
  PAGES.forEach((pg, i) => {
    const lines = []; let hd = null;
    pg.f.forEach((x) => {
      if (x.t === 'h') { hd = x.l; return; }
      let v = '';
      if (x.t === 'chips') v = (f[x.k] || []).join(', ');
      else if (['text', 'area', 'select'].includes(x.t)) v = String(f[x.k] || '').trim();
      else if (x.t === 'media') {
        const m = ['subject', 'object'].filter((k) => f['img_' + k]).map((k) => `- Foto ${k === 'subject' ? 'Subjek (Orang)' : 'Objek'}: [tertempel: ${f['img_' + k].label}]`);
        if (m.length) lines.push(...m);
        return;
      }
      if (!v) return;
      if (hd) { lines.push('\n### ' + hd); hd = null; }
      lines.push(v.includes('\n') ? `- ${x.l}:\n${v.split('\n').map((s) => '  ' + s).join('\n')}` : `- ${x.l}: ${v}`);
    });
    if (lines.length) out.push(`\n## ${i + 1}. ${pg.n.toUpperCase()}${lines.join('\n').startsWith('\n') ? '' : '\n'}${lines.join('\n')}`);
  });
  const tpl = (f.tpl || []).filter((t) => TPL[t]);
  if (tpl.length) out.push('\n## ' + (PAGES.length + 1) + '. TEMPLATE LANJUTAN\n' + tpl.map((t) => `### ${t}\n${TPL[t]}`).join('\n\n'));
  out.push('\nJika ada informasi yang kurang atau ambigu, ajukan pertanyaan singkat terlebih dahulu sebelum menulis kode.');
  return out.join('\n');
}
function donut(p, s = 160, w = 16) {
  const r = (s - w) / 2, c = 2 * Math.PI * r, m = s / 2;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" role="img" aria-label="Progress ${p}%">
    <circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="${w}"/>
    ${p > 0 ? `<circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="#fff" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(c * p / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${m} ${m})"/>` : ''}
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="800" font-size="${Math.round(s * 0.24)}">${p}%</text>
  </svg>`;
}

/* ================= SIMPAN ================= */
const setStat = (t) => { const e = $('#save'); if (e) e.textContent = t; };
function touch() { cur.dirty = true; setStat('Mengetik…'); clearTimeout(timer); timer = setTimeout(flush, 1500); }
function flush() {
  clearTimeout(timer);
  const c = cur;
  if (!c || !c.dirty) return q;
  q = q.then(async () => {
    if (!c.dirty) return;
    c.dirty = false; setStat('Menyimpan…');
    try {
      const p = pct(c.form);
      c.completed_at = p === 100 ? c.completed_at || new Date().toISOString() : null;
      c.id = await api.save(c.id, { title: (c.form.name || '').trim() || 'Tanpa Judul', percent: p, completed_at: c.completed_at, updated_at: new Date().toISOString(), form: c.form });
      setStat('Tersimpan ✓');
    } catch (e) { c.dirty = true; setStat('Gagal simpan ⚠'); console.error(e); }
  });
  return q;
}

        <button data-act="newp" class="btn-light px-5 py-2.5 text-xs">Next Project ↗</button>
        <button data-act="out" class="glass-dark rounded-full px-4 py-2.5 text-xs font-bold">Keluar</button>
      </div>
    </header>
    <main id="hm" class="mx-auto mt-8 max-w-3xl"><p class="text-center text-sm text-neutral-300">Memuat…</p></main>
  </div>`;
  try {
    const list = await api.list();
    $('#hm').innerHTML = list.length
      ? `<div class="space-y-3">${list.map((r) => `
        <div class="glass flex flex-wrap items-center justify-between gap-3 rounded-3xl p-4">
          <div class="min-w-0">
            <p class="truncate text-sm font-extrabold">${esc(r.title)}</p>
            <p class="text-[11px] text-neutral-600">${r.completed_at ? 'Selesai: ' + fmt(r.completed_at) : 'Draft • diperbarui ' + fmt(r.updated_at)} • ${r.percent}%</p>
          </div>
          <div class="flex gap-2">
            <button data-act="detail" data-id="${r.id}" class="btn-dark px-4 py-2 text-xs">Detail</button>
            <button data-act="remove" data-id="${r.id}" class="btn-light px-4 py-2 text-xs">Remove</button>
          </div>
        </div>`).join('')}</div>`
      : `<div class="flex min-h-[60vh] items-center justify-center"><h2 class="text-center text-4xl font-extrabold drop-shadow-lg sm:text-6xl">Let's Make Project!!</h2></div>`;
  } catch (e) {
    console.error(e);
    $('#hm').innerHTML = `<p class="glass rounded-3xl p-4 text-center text-sm">Gagal memuat data.<br><span class="text-[11px] text-neutral-600">${esc(e.message || e.code || '')}</span></p>`;
  }
}

/* ================= TAMPILAN: WIZARD ================= */
function fieldHTML(x, f) {
  const v = f[x.k];
  switch (x.t) {
    case 'h': return `<h3 class="mt-7 border-b border-neutral-900/10 pb-1.5 text-xs font-extrabold uppercase tracking-wider text-neutral-500">${esc(x.l)}</h3>`;
    case 'info': return `<p class="mt-3 text-xs text-neutral-600">${esc(x.l)}</p>`;
    case 'text': return `<label class="lb">${esc(x.l)}</label><input data-k="${x.k}" value="${esc(v)}" placeholder="${esc(x.p)}" class="field w-full rounded-full px-4 py-2.5 text-sm" />`;
    case 'area': return `<label class="lb">${esc(x.l)}</label><textarea data-k="${x.k}" rows="${x.r}" placeholder="${esc(x.p)}" class="field w-full rounded-3xl px-4 py-2.5 text-sm">${esc(v)}</textarea>`;
    case 'select': return `<label class="lb">${esc(x.l)}</label><select data-k="${x.k}" class="field w-full rounded-full px-4 py-2.5 text-sm">${x.o.map((o) => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    case 'chips': return `<label class="lb">${esc(x.l)}</label><div class="flex flex-wrap gap-2">${x.o.map((o) => `<label class="chip"><input type="checkbox" data-k="${x.k}" data-v="${esc(o)}" ${(v || []).includes(o) ? 'checked' : ''} /><span>${esc(o)}</span></label>`).join('')}</div>`;
    case 'links': return `<label class="lb">${esc(x.l)}</label><div class="flex flex-wrap gap-2">${x.items.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener noreferrer" class="btn-light px-3.5 py-1.5 text-xs">${esc(n)} ↗</a>`).join('')}</div>`;
    case 'media': return `<div class="mt-4 grid gap-4 sm:grid-cols-2">${['subject', 'object'].map((k) => { const im = f['img_' + k]; return `
      <div data-paste="${k}" tabindex="0" class="rounded-3xl border border-dashed border-neutral-900/30 bg-white/50 p-4">
        <div class="flex items-center justify-between gap-2"><b class="text-xs">${k === 'subject' ? 'Foto Subjek (Orang / Profil)' : 'Foto Objek (Produk / QR / Proyek)'}</b>
        <button type="button" data-act="pick" data-kind="${k}" class="btn-dark px-3 py-1.5 text-[11px]">Tempel / Pilih</button></div>
        <input type="file" accept="image/*" data-file="${k}" class="hidden" />
        ${im ? `<img src="${im.dataUrl}" alt="" class="mt-3 h-36 w-full rounded-2xl ${k === 'object' ? 'bg-white object-contain p-2' : 'object-cover'}" />
        <div class="mt-2 flex justify-between text-[11px] text-neutral-600"><span>${esc(im.label)}</span><button type="button" data-act="clear" data-kind="${k}" class="font-bold underline">Hapus</button></div>`
        : '<p class="mt-3 text-[11px] text-neutral-500">Klik kotak ini lalu tempel (Ctrl+V), atau pilih file.</p>'}
      </div>`; }).join('')}</div>`;
  }
  return '';
}

function summaryHTML(f) {
  const p = pct(f), prompt = buildPrompt(f);
  return `
  <span class="text-[11px] font-extrabold uppercase tracking-wider text-neutral-500">Ringkasan</span>
  <h2 class="text-xl font-extrabold">${esc(f.name || 'Tanpa Judul')}</h2>
  <div class="mt-5 grid gap-4 sm:grid-cols-3">
    <div class="flex flex-col items-center justify-center rounded-3xl bg-neutral-900 p-5 text-white">
      ${donut(p, 160, 16)}
      <p class="mt-2 text-xs text-neutral-400">Kemajuan Proyek</p>
    </div>
    <div class="space-y-1.5 sm:col-span-2">${PAGES.map((pg, i) => `
      <button data-go="${i}" class="flex w-full items-center justify-between rounded-full bg-white/70 px-4 py-2 text-left text-xs font-semibold hover:bg-white"><span>${i + 1} • ${esc(pg.n)}</span><span>${f._done[i] ? '✓ Done' : '○'}</span></button>`).join('')}
    </div>
  </div>
  ${p < 100 ? '<p class="mt-3 text-[11px] text-neutral-600">Tekan Done di tiap page untuk mencapai 100%.</p>' : ''}
  <label class="lb">Ringkasan Prompt</label>
  <textarea readonly rows="16" class="w-full rounded-3xl border border-neutral-900/20 bg-neutral-900 p-4 font-mono text-xs leading-relaxed text-neutral-100">${esc(prompt)}</textarea>
  <p class="mt-1 text-[11px] text-neutral-500">${prompt.length} karakter</p>
  <div class="mt-4 flex flex-wrap gap-2">
    <button data-act="download" class="btn-dark px-5 py-2.5 text-xs">Download .txt ↓</button>
    <button data-act="copy" class="btn-light px-5 py-2.5 text-xs">Salin Prompt</button>
    <button data-act="finish" class="btn-light px-5 py-2.5 text-xs">Simpan &amp; ke Home</button>
  </div>`;
}

function renderWizard() {
  const f = cur.form, i = cur.page, last = i === SUMMARY_IDX, pg = PAGES[i];
  const titles = [...PAGES.map((p) => p.n), 'Ringkasan & Download'];
  app.innerHTML = `
  <div class="min-h-screen p-3 sm:p-6"><div class="mx-auto max-w-6xl">
    <header class="flex flex-wrap items-center justify-between gap-3 text-white">
      <div class="flex items-center gap-2">
        <button data-act="menu" class="btn-light px-4 py-2 text-xs">☰ Menu</button>
        <button data-act="tohome" class="text-lg font-extrabold">Web Blueprint</button>
      </div>
      <div class="glass-dark flex items-center gap-3 rounded-full px-4 py-2 text-xs font-bold"><span id="save" class="font-medium text-neutral-300"></span>${donut(pct(f), 40, 5)}<span>Progress</span></div>
    </header>
    <div class="mt-4 flex items-start gap-4">
      <aside id="side" class="${sideOpen ? '' : 'hidden'} glass-dark fixed bottom-3 left-3 top-20 z-30 w-64 overflow-auto rounded-3xl p-3 lg:static lg:top-auto lg:bottom-auto">
        <p class="px-2 pb-2 text-[11px] font-extrabold uppercase tracking-wider text-neutral-400">Navigasi Page</p>
        <nav class="space-y-1">${titles.map((t, k) => `<button data-go="${k}" class="nav-item w-full text-left ${k === i ? 'active' : ''}">${k < PAGES.length ? (f._done[k] ? '✓ ' : '') + (k + 1) + ' • ' : '★ '}${esc(t)}</button>`).join('')}</nav>
      </aside>
      <section class="glass min-w-0 flex-1 rounded-[28px] p-5 sm:p-7">
        ${last ? summaryHTML(f) : `
          <span class="text-[11px] font-extrabold uppercase tracking-wider text-neutral-500">0${i + 1} • ${esc(pg.n)}</span>
          <h2 class="text-xl font-extrabold">${esc(pg.h)}</h2>
          <div>${pg.f.map((x) => fieldHTML(x, f)).join('')}</div>`}
        <div class="mt-8 flex flex-wrap items-center gap-2 border-t border-neutral-900/10 pt-4">
          ${i === 0 ? '<button data-act="tohome" class="btn-light px-5 py-2.5 text-xs">⌂ Back</button>' : ''}
          ${i === 0 ? '' : '<button data-act="prev" class="btn-light px-5 py-2.5 text-xs">← Previous</button>'}
          ${last ? '' : '<button data-act="next" class="btn-dark px-5 py-2.5 text-xs">Next →</button>'}
          ${last ? '' : `<button data-act="done" class="chip ${f._done[i] ? 'on' : ''}">${f._done[i] ? '✓ Done' : 'Done'}</button>`}
        </div>
      </section>
    </div>
  </div></div>`;
}

function go(n) {
  cur.page = Math.max(0, Math.min(SUMMARY_IDX, n));
  renderWizard(); window.scrollTo({ top: 0 }); flush();
  if (window.innerWidth < 1024) sideOpen = false;
}

/* ================= FOTO ================= */
function processImage(blob, kind) {
  const r = new FileReader();
  r.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const max = 600; let { width: w, height: h } = img;
      if (w > max || h > max) { if (w > h) { h = Math.round((h * max) / w); w = max; } else { w = Math.round((w * max) / h); h = max; } }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const d = c.toDataURL('image/jpeg', 0.7);
      cur.form['img_' + kind] = { dataUrl: d, label: `Gambar tertempel (${w}x${h}px, ~${Math.round((d.length * 3) / 4 / 1024)}KB)` };
      touch(); renderWizard();
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(blob);
}
async function pickImage(kind) {
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) { const t = it.types.find((x) => x.startsWith('image/')); if (t) return processImage(await it.getType(t), kind); }
  } catch (e) {}
  document.querySelector(`[data-file="${kind}"]`).click();
}

/* ================= EVENT ================= */
app.addEventListener('click', async (e) => {
  const go_ = e.target.closest('[data-go]');
  if (go_ && cur) return go(+go_.dataset.go);
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, kind = b.dataset.kind;
  if (a === 'peek') { if (b._isHold && b._isHold()) return; return peek($('#pw').type === 'password'); }
  if (a === 'hint') return $('#hint').classList.toggle('hidden');
  if (a === 'out') { await flush(); await api.logout(); return viewLogin(); }
  if (a === 'newp') { cur = { id: null, form: newForm(), page: 0, dirty: false, completed_at: null }; return renderWizard(); }
  if (a === 'detail') {
    try { const r = await api.get(id); cur = { id: r.id, form: { ...newForm(), ...r.form, _done: r.form._done || {} }, page: SUMMARY_IDX, dirty: false, completed_at: r.completed_at }; renderWizard(); }
    catch (err) { alert('Gagal membuka project.'); }
    return;
  }
  if (a === 'remove') {
    if (!confirm('Hapus project ini secara permanen?')) return;
    try { await api.remove(id); viewHome(); } catch (err) { alert('Gagal menghapus.'); }
    return;
  }
  if (!cur) return;
  if (a === 'menu') { sideOpen = !sideOpen; return $('#side').classList.toggle('hidden', !sideOpen); }
  if (a === 'tohome') { await flush(); return viewHome(); }
  if (a === 'finish') { await flush(); return viewHome(); }
  if (a === 'prev') return go(cur.page - 1);
  if (a === 'next') return go(cur.page + 1);
  if (a === 'done') { cur.form._done[cur.page] = !cur.form._done[cur.page]; touch(); return renderWizard(); }
  if (a === 'pick') return pickImage(kind);
  if (a === 'clear') { delete cur.form['img_' + kind]; touch(); return renderWizard(); }
  if (a === 'copy') { await navigator.clipboard.writeText(buildPrompt(cur.form)); b.textContent = 'Tersalin!'; return setTimeout(() => (b.textContent = 'Salin Prompt'), 1500); }
  if (a === 'download') {
    const n = (cur.form.name || 'blueprint').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'blueprint';
    const l = document.createElement('a');
    l.href = URL.createObjectURL(new Blob([buildPrompt(cur.form)], { type: 'text/plain;charset=utf-8' }));
    l.download = n + '-prompt.txt'; l.click(); setTimeout(() => URL.revokeObjectURL(l.href), 1000);
  }
});

app.addEventListener('input', (e) => {
  const t = e.target;
  if (!cur || !t.dataset.k || t.type === 'checkbox') return;
  cur.form[t.dataset.k] = t.value; touch();
});
app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.file && t.files[0]) return processImage(t.files[0], t.dataset.file);
  if (!cur || !t.dataset.k || t.type !== 'checkbox') return;
  const arr = cur.form[t.dataset.k] || [];
  cur.form[t.dataset.k] = t.checked ? [...new Set([...arr, t.dataset.v])] : arr.filter((x) => x !== t.dataset.v);
  touch();
});
app.addEventListener('paste', (e) => {
  const box = e.target.closest && e.target.closest('[data-paste]');
  if (!box || !cur) return;
  for (const it of e.clipboardData?.items || []) {
    if (it.type.startsWith('image/')) { e.preventDefault(); const bl = it.getAsFile(); if (bl) processImage(bl, box.dataset.paste); break; }
  }
});
app.addEventListener('submit', async (e) => {
  if (e.target.id !== 'lf') return;
  e.preventDefault();
  const err = $('#err');
  const ok = await api.login($('#pw').value);
  if (ok) return viewHome();
  err.textContent = 'Akses ditolak.' + (window._err ? ' (' + window._err + ')' : ' Password salah.'); err.classList.remove('hidden');
});
window.addEventListener('beforeunload', () => { if (cur && cur.dirty) flush(); });

/* ================= MULAI ================= */
(async () => { (await api.session()) ? viewHome() : viewLogin(); })();
</script>
